<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — CareBoard</title>
  <style>
    html, body { height: 100%; margin: 0; background: #fcfbf7; color: #20312d; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { display: grid; place-items: center; min-height: 100%; padding: 2rem; text-align: center; }
    h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
    p { margin: 0; color: #64746f; line-height: 1.5; }
    a { display: inline-block; margin-top: 1.5rem; padding: 0.75rem 1.25rem; border-radius: 1rem; background: #287b6f; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>You are offline</h1>
      <p>CareBoard can’t load this page right now because your network connection is unavailable.</p>
      <a href="/dashboard">Try the dashboard again</a>
    </div>
  </main>
</body>
</html>
